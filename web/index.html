<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPv6 Tunnel Manager</title>
<style>
  :root {
    --bg: #1a1a2e;
    --bg2: #16213e;
    --bg3: #0f3460;
    --accent: #00b4d8;
    --accent-hover: #0096c7;
    --text: #e0e0e0;
    --text-dim: #8892a4;
    --green: #4caf50;
    --red: #f44336;
    --border: #2a2a4a;
    --input-bg: #1a1a3e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: clamp(20px, 4vw, 36px);
  }
  .container { width: min(1120px, 100%); margin: 0 auto; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  .status-card {
    background: var(--bg2); border-radius: 12px; padding: 24px;
    margin-bottom: 16px; border: 1px solid var(--border);
  }
  .status-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 20px; padding: 8px 0; border-bottom: 1px solid var(--border);
  }
  .status-row:last-child { border-bottom: none; }
  .status-label { color: var(--text-dim); font-size: 14px; flex: 0 0 180px; }
  .status-value {
    font-family: monospace; font-size: 14px; text-align: right;
    flex: 1; min-width: 0; overflow-wrap: anywhere;
  }
  .status-value-ping {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
  }
  .ping-content {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    min-width: 0;
  }
  .status-subvalue {
    color: var(--text-dim);
    font-size: 12px;
    font-family: inherit;
  }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 12px;
    font-size: 12px; font-weight: 600;
  }
  .badge-up { background: rgba(76,175,80,0.2); color: var(--green); }
  .badge-down { background: rgba(244,67,54,0.2); color: var(--red); }
  .controls {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .profile-actions {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px;
  }
  button {
    padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 500; transition: background 0.2s;
  }
  .btn-start { background: var(--green); color: white; }
  .btn-start:hover { background: #45a049; }
  .btn-stop { background: var(--red); color: white; }
  .btn-stop:hover { background: #e53935; }
  .btn-restart { background: var(--accent); color: white; }
  .btn-restart:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .settings {
    background: var(--bg2); border-radius: 12px; padding: 24px;
    border: 1px solid var(--border);
  }
  .settings summary {
    cursor: pointer; font-size: 16px; font-weight: 600;
    padding: 4px 0; list-style: none;
  }
  .settings summary::before { content: "\2699\FE0F  "; }
  .form-group { margin-top: 16px; }
  .form-group label {
    display: block; font-size: 13px; color: var(--text-dim);
    margin-bottom: 4px;
  }
  .form-group input, .form-group select {
    width: 100%; padding: 8px 12px; background: var(--input-bg);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: monospace; font-size: 14px;
  }
  .form-group input:focus, .form-group select:focus {
    outline: none; border-color: var(--accent);
  }
  .form-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .section-title {
    font-size: 14px; font-weight: 600; color: var(--accent);
    margin-top: 20px; margin-bottom: 8px;
    padding-top: 12px; border-top: 1px solid var(--border);
  }
  .networks-list { margin-top: 8px; }
  .network-entry {
    display: grid; grid-template-columns: minmax(96px, 120px) minmax(0, 1.7fr) minmax(96px, 0.8fr) 40px;
    gap: 8px; align-items: center; margin-bottom: 8px;
  }
  .network-entry input { font-size: 13px; }
  .btn-sm {
    padding: 6px 12px; font-size: 12px; border-radius: 6px;
  }
  .btn-add { background: var(--bg3); color: var(--accent); border: 1px solid var(--accent); }
  .btn-del { background: transparent; color: var(--red); border: none; font-size: 18px; cursor: pointer; }
  .btn-save {
    margin-top: 20px; width: 100%;
    background: var(--accent); color: white; padding: 12px;
  }
  .btn-secondary {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: #1a4778;
  }
  .btn-save:hover { background: var(--accent-hover); }
  .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .checkbox-group input[type="checkbox"] { width: auto; }
  .hint {
    margin-top: 8px;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.45;
  }
  .hint strong {
    color: var(--text);
  }
  .hint-err {
    color: #ff9f9f;
  }
  .toast {
    position: fixed; bottom: 20px; right: 20px; padding: 12px 20px;
    border-radius: 8px; font-size: 14px; display: none; z-index: 100;
  }
  .toast-ok { background: var(--green); color: white; }
  .toast-err { background: var(--red); color: white; }
  @media (max-width: 820px) {
    .container { width: 100%; }
    .status-label { flex-basis: 140px; }
  }
  @media (max-width: 680px) {
    body { padding: 16px; }
    header { gap: 12px; align-items: flex-start; flex-direction: column; }
    .form-row { grid-template-columns: 1fr; }
    .network-entry { grid-template-columns: 1fr; }
    .status-row { align-items: flex-start; }
    .status-label { flex-basis: auto; }
    .status-value { text-align: left; }
    .status-value-ping {
      width: 100%;
      justify-content: space-between;
      align-items: flex-start;
    }
    .ping-content { align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>IPv6 Tunnel Manager</h1>
    <span id="refresh-indicator" style="color:var(--text-dim);font-size:12px"></span>
  </header>

  <div class="status-card" id="status-card">
    <div class="status-row">
      <span class="status-label">Status</span>
      <span id="st-badge" class="badge badge-down">DOWN</span>
    </div>
    <div class="status-row">
      <span class="status-label">Desired State</span>
      <span class="status-value" id="st-desired">disabled</span>
    </div>
    <div class="status-row">
      <span class="status-label">Active Profile</span>
      <span class="status-value" id="st-profile">-</span>
    </div>
    <div class="status-row">
      <span class="status-label">Broker</span>
      <span class="status-value" id="st-broker">-</span>
    </div>
    <div class="status-row">
      <span class="status-label">Interface</span>
      <span class="status-value" id="st-iface">-</span>
    </div>
    <div class="status-row">
      <span class="status-label">WAN IPv4</span>
      <span class="status-value" id="st-wan">-</span>
    </div>
    <div class="status-row">
      <span class="status-label">Local IPv6</span>
      <span class="status-value" id="st-ipv6">-</span>
    </div>
    <div class="status-row">
      <span class="status-label">Tunnel MTU</span>
      <span class="status-value" id="st-mtu">-</span>
    </div>
    <div class="status-row">
      <span class="status-label">Ping</span>
      <div class="status-value status-value-ping">
        <span id="st-ping-info" class="ping-content">
          <span id="st-ping-result">-</span>
          <span id="st-ping-meta" class="status-subvalue">Last ping: never</span>
        </span>
        <button id="btn-ping-now" type="button" class="btn-secondary btn-sm" onclick="probePing()">Ping now</button>
      </div>
    </div>
    <div class="status-row">
      <span class="status-label">Last Error</span>
      <span class="status-value" id="st-error">-</span>
    </div>
    <div id="st-networks"></div>
  </div>

  <div class="controls">
    <button class="btn-start" onclick="tunnelAction('up')">Start</button>
    <button class="btn-stop" onclick="tunnelAction('down')">Stop</button>
    <button class="btn-restart" onclick="tunnelAction('restart')">Restart</button>
  </div>

  <details class="settings">
    <summary>Settings</summary>
    <form id="config-form" onsubmit="saveConfig(event)">
      <div class="section-title">Profiles</div>
      <div class="form-row">
        <div class="form-group">
          <label>Selected Profile</label>
          <select id="cfg-profile-select"></select>
        </div>
        <div class="form-group">
          <label>Profile Name</label>
          <input id="cfg-profile-name" placeholder="HE Home" required>
        </div>
      </div>
      <div class="profile-actions">
        <button type="button" class="btn-secondary btn-sm" onclick="createProfile()">New</button>
        <button type="button" class="btn-secondary btn-sm" onclick="duplicateProfile()">Duplicate</button>
        <button type="button" class="btn-secondary btn-sm" onclick="renameProfile()">Rename</button>
        <button type="button" class="btn-secondary btn-sm" onclick="deleteProfile()">Delete</button>
        <button type="button" class="btn-secondary btn-sm" onclick="activateProfile()">Activate</button>
      </div>
      <div id="profile-meta" class="hint"></div>

      <div class="section-title">Tunnel</div>
      <div class="form-group">
        <label>Broker</label>
        <select id="cfg-broker">
          <option value="he">Hurricane Electric</option>
          <option value="ip4market">ip4market.ru</option>
          <option value="6in4ru">6in4.ru</option>
          <option value="custom">Custom</option>
        </select>
        <div id="broker-hint" class="hint"></div>
      </div>
      <div class="form-group">
        <label>Remote Endpoint (IPv4)</label>
        <input id="cfg-remote-endpoint" placeholder="216.66.88.98">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Local IPv6</label>
          <input id="cfg-local-ipv6" placeholder="2001:470:..::2/64">
        </div>
        <div class="form-group">
          <label>Remote IPv6</label>
          <input id="cfg-remote-ipv6" placeholder="2001:470:..::1/64">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>TTL</label>
          <input id="cfg-ttl" type="number" value="255">
        </div>
        <div class="form-group">
          <label>MTU (blank = auto)</label>
          <input id="cfg-mtu" type="number" min="0" placeholder="Auto from WAN MTU">
        </div>
      </div>

      <div class="section-title">LAN</div>
      <div class="checkbox-group">
        <input type="checkbox" id="cfg-lan-enabled">
        <label for="cfg-lan-enabled">Enable IPv6 on LAN</label>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>DNS Servers (blank = router LAN IPv6)</label>
          <input id="cfg-dns" placeholder="Auto: prefix::1">
        </div>
        <div class="form-group">
          <label>Mode</label>
          <select id="cfg-mode">
            <option value="slaac">SLAAC</option>
            <option value="dhcpv6">DHCPv6</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Networks</label>
        <div id="networks-list" class="networks-list"></div>
        <button type="button" class="btn-sm btn-add" onclick="addNetwork()">+ Add Network</button>
      </div>

      <div class="section-title">Health Check</div>
      <div class="checkbox-group">
        <input type="checkbox" id="cfg-health-enabled">
        <label for="cfg-health-enabled">Enable health monitoring</label>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Interval (sec)</label>
          <input id="cfg-health-interval" type="number" value="30">
        </div>
        <div class="form-group">
          <label>Ping Target</label>
          <input id="cfg-health-target" placeholder="2001:4860:4860::8888">
        </div>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="cfg-auto-restart">
        <label for="cfg-auto-restart">Auto-restart on failure</label>
      </div>

      <div class="section-title">Server</div>
      <div class="form-group">
        <label>WAN Interface</label>
        <input id="cfg-wan-iface" value="ppp0">
      </div>
      <div class="form-group">
        <label>Auth Token</label>
        <input id="cfg-token" type="password" placeholder="(leave empty to disable)">
      </div>

      <button type="submit" class="btn-save">Save Config</button>
    </form>
  </details>
</div>

<div id="toast" class="toast"></div>

<script>
const API = window.location.origin;
let authToken = localStorage.getItem('ipv6tunnel_token') || '';
let configDocument = null;
let currentTunnelEnabled = false;
let currentServerPort = 9086;
let currentConfiguredMTU = 0;
let lastStatus = null;
let currentAutoDNSValues = [];
let isUsingAutoDNS = false;
let isDNSManuallyEdited = false;
let selectedProfileId = '';
let isPingInFlight = false;

const brokerPresets = {
  he: {
    label: 'Hurricane Electric',
    description: 'Classic tunnelbroker.net style 6in4 tunnel.',
    remoteEndpoint: '216.66.80.90',
    localIPv6: '2001:470:..::2/64',
    remoteIPv6: '2001:470:..::1/64'
  },
  ip4market: {
    label: 'ip4market.ru',
    description: 'Provider preset with the same 6in4 runtime, just different broker-specific values.',
    remoteEndpoint: 'broker IPv4 from provider',
    localIPv6: 'client tunnel IPv6/64',
    remoteIPv6: 'server tunnel IPv6/64'
  },
  "6in4ru": {
    label: '6in4.ru',
    description: 'Manual 6in4 values from 6in4.ru. Runtime logic stays identical.',
    remoteEndpoint: 'broker IPv4 from provider',
    localIPv6: 'client tunnel IPv6/64',
    remoteIPv6: 'server tunnel IPv6/64'
  },
  custom: {
    label: 'Custom',
    description: 'Fully manual profile. Fill all tunnel values yourself.',
    remoteEndpoint: '203.0.113.1',
    localIPv6: '2001:db8::2/64',
    remoteIPv6: '2001:db8::1/64'
  }
};

function headers() {
  const h = {'Content-Type': 'application/json'};
  if (authToken) h['Authorization'] = 'Bearer ' + authToken;
  return h;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function api(method, path, body) {
  const opts = {method, headers: headers()};
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  if (res.status === 401) {
    const t = prompt('Enter auth token:');
    if (!t) throw new Error('Authentication required');
    authToken = t;
    localStorage.setItem('ipv6tunnel_token', authToken);
    return api(method, path, body);
  }
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function toast(msg, ok) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err');
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

async function refreshStatus() {
  try {
    renderStatus(await api('GET', '/api/status'));
  } catch (e) {
    console.error('status:', e);
  }
}

function formatEffectiveMTU(effectiveMTU) {
  if (!effectiveMTU) return '-';
  return currentConfiguredMTU > 0 ? effectiveMTU + ' (manual)' : effectiveMTU + ' (auto)';
}

function renderStatus(st) {
  lastStatus = st;
  currentTunnelEnabled = !!st.desired_enabled;
  const badge = document.getElementById('st-badge');
  badge.textContent = st.tunnel_up ? 'UP' : 'DOWN';
  badge.className = 'badge ' + (st.tunnel_up ? 'badge-up' : 'badge-down');
  document.getElementById('st-desired').textContent = st.desired_enabled ? 'enabled' : 'disabled';
  document.getElementById('st-profile').textContent = st.active_profile_name || st.active_profile_id || '-';
  document.getElementById('st-broker').textContent = st.active_broker || '-';
  document.getElementById('st-iface').textContent = st.interface || '-';
  document.getElementById('st-wan').textContent = st.wan_ipv4 || '-';
  document.getElementById('st-ipv6').textContent = st.local_ipv6 || '-';
  document.getElementById('st-mtu').textContent = formatEffectiveMTU(st.effective_mtu);
  document.getElementById('st-error').textContent = st.last_error || '-';
  renderPingStatus(st);
  updatePingButtonState();
  const nw = document.getElementById('st-networks');
  if (st.networks && st.networks.length > 0) {
    nw.innerHTML = st.networks.map(n =>
      '<div class="status-row"><span class="status-label">' + esc(n.interface) +
      '</span><span class="status-value">' + esc(n.prefix) + '</span></div>'
    ).join('');
    return;
  }
  nw.innerHTML = '';
}

function renderPingStatus(st) {
  const pingResult = document.getElementById('st-ping-result');
  const pingMeta = document.getElementById('st-ping-meta');
  if (st.ping_ok) {
    pingResult.innerHTML = '<span style="color:var(--green)">' + st.ping_ms + 'ms</span>';
  } else if (st.last_ping_at) {
    pingResult.innerHTML = '<span style="color:var(--red)">failed</span>';
  } else {
    pingResult.textContent = '-';
  }
  pingMeta.textContent = formatPingTimestamp(st.last_ping_at);
}

function formatPingTimestamp(value) {
  if (!value) return 'Last ping: never';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return 'Last ping: -';
  return 'Last ping: ' + date.toLocaleString();
}

function getActiveProfileForPing() {
  if (!configDocument || !Array.isArray(configDocument.profiles)) return null;
  const activeProfileId = configDocument.active_profile_id || (lastStatus && lastStatus.active_profile_id) || '';
  return configDocument.profiles.find(profile => profile.id === activeProfileId) || null;
}

function canRunManualPing() {
  const profile = getActiveProfileForPing();
  if (!profile || !profile.config || !profile.config.health) return false;
  return !!profile.config.health.enabled && !!String(profile.config.health.target || '').trim();
}

function updatePingButtonState() {
  const button = document.getElementById('btn-ping-now');
  const canPing = canRunManualPing();
  button.disabled = isPingInFlight || !canPing;
  button.textContent = isPingInFlight ? 'Pinging...' : 'Ping now';
  button.title = canPing ? '' : 'Enable health monitoring and set Ping Target';
}

async function tunnelAction(action) {
  document.querySelectorAll('.controls button').forEach(b => b.disabled = true);
  try {
    await api('POST', '/api/tunnel/' + action);
    toast('Tunnel ' + action + ' OK', true);
    setTimeout(refreshStatus, 1000);
  } catch (e) {
    toast('Error: ' + e.message, false);
  } finally {
    document.querySelectorAll('.controls button').forEach(b => b.disabled = false);
  }
}

async function probePing() {
  if (isPingInFlight) return;
  isPingInFlight = true;
  updatePingButtonState();
  try {
    const status = await api('GET', '/api/health');
    renderStatus(status);
    toast(status.ping_ok ? 'Ping OK' : 'Ping failed', status.ping_ok);
  } catch (e) {
    toast('Error: ' + e.message, false);
  } finally {
    isPingInFlight = false;
    updatePingButtonState();
  }
}

function addNetwork(iface, prefix, comment) {
  const list = document.getElementById('networks-list');
  const row = document.createElement('div');
  row.className = 'network-entry';
  row.innerHTML =
    '<input placeholder="br0" value="' + esc(iface||'') + '">' +
    '<input placeholder="2001:470:xxxx:1::/64" value="' + esc(prefix||'') + '">' +
    '<input placeholder="Name" value="' + esc(comment||'') + '">' +
    '<span class="btn-del" onclick="this.parentElement.remove(); refreshAutoDNSField();">x</span>';
  list.appendChild(row);
  row.querySelectorAll('input').forEach(input => input.addEventListener('input', refreshAutoDNSField));
  refreshAutoDNSField();
}

function deepClone(value) {
  return JSON.parse(JSON.stringify(value));
}

function getSelectedProfile() {
  if (!configDocument || !Array.isArray(configDocument.profiles)) return null;
  return configDocument.profiles.find(profile => profile.id === selectedProfileId) || null;
}

function ensureSelectedProfile() {
  if (!configDocument || !configDocument.profiles || configDocument.profiles.length === 0) return;
  const selectedProfile = getSelectedProfile();
  if (selectedProfile) return;
  selectedProfileId = configDocument.active_profile_id || configDocument.profiles[0].id;
}

function slugifyProfileId(name) {
  const slug = String(name || '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 48);
  return slug || 'profile';
}

function makeUniqueProfileId(baseId) {
  const usedIds = new Set((configDocument?.profiles || []).map(profile => profile.id));
  if (!usedIds.has(baseId)) return baseId;
  let suffix = 2;
  while (usedIds.has(baseId + '-' + suffix)) suffix += 1;
  return baseId + '-' + suffix;
}

function makeUniqueProfileName(baseName) {
  const usedNames = new Set((configDocument?.profiles || []).map(profile => profile.name));
  if (!usedNames.has(baseName)) return baseName;
  let suffix = 2;
  while (usedNames.has(baseName + ' ' + suffix)) suffix += 1;
  return baseName + ' ' + suffix;
}

function buildProfileOptionLabel(profile) {
  const parts = [profile.name || profile.id];
  if (profile.id === configDocument.active_profile_id) parts.push('active');
  if (profile.is_valid === false) parts.push('draft');
  return parts.join(' · ');
}

function renderProfileSelect() {
  ensureSelectedProfile();
  const select = document.getElementById('cfg-profile-select');
  select.innerHTML = '';
  (configDocument.profiles || []).forEach(profile => {
    const option = document.createElement('option');
    option.value = profile.id;
    option.textContent = buildProfileOptionLabel(profile);
    if (profile.id === selectedProfileId) option.selected = true;
    select.appendChild(option);
  });
}

function renderBrokerHint() {
  const broker = document.getElementById('cfg-broker').value || 'custom';
  const preset = brokerPresets[broker] || brokerPresets.custom;
  document.getElementById('broker-hint').innerHTML =
    '<strong>' + esc(preset.label) + '</strong>: ' + esc(preset.description);
  document.getElementById('cfg-remote-endpoint').placeholder = preset.remoteEndpoint;
  document.getElementById('cfg-local-ipv6').placeholder = preset.localIPv6;
  document.getElementById('cfg-remote-ipv6').placeholder = preset.remoteIPv6;
}

function renderProfileMeta() {
  const profile = getSelectedProfile();
  const meta = document.getElementById('profile-meta');
  if (!profile) {
    meta.textContent = 'No profile selected';
    return;
  }
  const parts = [];
  parts.push((profile.id === configDocument.active_profile_id ? 'Active' : 'Draft') + ' profile');
  parts.push('ID: ' + profile.id);
  parts.push('Storage: ' + (configDocument.storage_format || 'profiles'));
  if (profile.is_valid === false && Array.isArray(profile.validation_errors) && profile.validation_errors.length > 0) {
    meta.className = 'hint hint-err';
    meta.innerHTML = parts.join(' · ') + '<br>' + esc(profile.validation_errors.join(' | '));
    return;
  }
  meta.className = 'hint';
  meta.textContent = parts.join(' · ');
}

function loadSelectedProfileIntoForm() {
  ensureSelectedProfile();
  renderProfileSelect();
  const profile = getSelectedProfile();
  if (!profile) return;
  document.getElementById('cfg-profile-name').value = profile.name || '';
  document.getElementById('cfg-broker').value = profile.config.tunnel.broker || 'custom';
  document.getElementById('cfg-remote-endpoint').value = profile.config.tunnel.remote_endpoint || '';
  document.getElementById('cfg-local-ipv6').value = profile.config.tunnel.local_ipv6 || '';
  document.getElementById('cfg-remote-ipv6').value = profile.config.tunnel.remote_ipv6 || '';
  document.getElementById('cfg-ttl').value = profile.config.tunnel.ttl || 255;
  document.getElementById('cfg-mtu').value = profile.config.tunnel.mtu > 0 ? profile.config.tunnel.mtu : '';
  currentConfiguredMTU = profile.config.tunnel.mtu || 0;
  document.getElementById('cfg-lan-enabled').checked = !!profile.config.lan.enabled;
  document.getElementById('cfg-mode').value = profile.config.lan.mode || 'slaac';
  document.getElementById('networks-list').innerHTML = '';
  (profile.config.lan.networks || []).forEach(network => addNetwork(network.interface, network.prefix, network.comment));
  currentAutoDNSValues = deriveAutoDNSValues(profile.config.lan.networks || []);
  isUsingAutoDNS = !profile.config.lan.dns || profile.config.lan.dns.length === 0;
  isDNSManuallyEdited = false;
  document.getElementById('cfg-dns').value = isUsingAutoDNS ? currentAutoDNSValues.join(', ') : (profile.config.lan.dns || []).join(', ');
  document.getElementById('cfg-health-enabled').checked = !!profile.config.health.enabled;
  document.getElementById('cfg-health-interval').value = profile.config.health.interval_sec || 30;
  document.getElementById('cfg-health-target').value = profile.config.health.target || '';
  document.getElementById('cfg-auto-restart').checked = !!profile.config.health.auto_restart;
  currentTunnelEnabled = !!configDocument.tunnel_enabled;
  currentServerPort = configDocument.server.port || 9086;
  document.getElementById('cfg-wan-iface').value = configDocument.server.wan_interface || 'ppp0';
  document.getElementById('cfg-token').value = configDocument.server.auth_token || '';
  renderBrokerHint();
  renderProfileMeta();
  if (lastStatus) document.getElementById('st-mtu').textContent = formatEffectiveMTU(lastStatus.effective_mtu);
  updatePingButtonState();
}

function syncSelectedProfileFromForm() {
  const profile = getSelectedProfile();
  if (!profile) return;
  const networks = collectNetworks();
  const dnsValue = isUsingAutoDNS && !isDNSManuallyEdited ? [] : parseConfiguredDNS(document.getElementById('cfg-dns').value);
  profile.name = document.getElementById('cfg-profile-name').value.trim();
  profile.config.tunnel = {
    broker: document.getElementById('cfg-broker').value,
    remote_endpoint: document.getElementById('cfg-remote-endpoint').value.trim(),
    local_ipv6: document.getElementById('cfg-local-ipv6').value.trim(),
    remote_ipv6: document.getElementById('cfg-remote-ipv6').value.trim(),
    ttl: parseInt(document.getElementById('cfg-ttl').value, 10) || 255,
    mtu: parseOptionalNumber(document.getElementById('cfg-mtu').value)
  };
  profile.config.lan = {
    enabled: document.getElementById('cfg-lan-enabled').checked,
    dns: dnsValue,
    mode: document.getElementById('cfg-mode').value,
    networks: networks
  };
  profile.config.health = {
    enabled: document.getElementById('cfg-health-enabled').checked,
    interval_sec: parseInt(document.getElementById('cfg-health-interval').value, 10) || 30,
    target: document.getElementById('cfg-health-target').value.trim(),
    auto_restart: document.getElementById('cfg-auto-restart').checked
  };
  configDocument.tunnel_enabled = currentTunnelEnabled;
  configDocument.server = {
    port: currentServerPort,
    wan_interface: document.getElementById('cfg-wan-iface').value.trim(),
    auth_token: document.getElementById('cfg-token').value
  };
  currentConfiguredMTU = profile.config.tunnel.mtu || 0;
}

function buildRequestDocument() {
  syncSelectedProfileFromForm();
  return {
    storage_format: configDocument.storage_format || 'profiles',
    tunnel_enabled: !!configDocument.tunnel_enabled,
    active_profile_id: configDocument.active_profile_id,
    profiles: (configDocument.profiles || []).map(profile => ({
      id: profile.id,
      name: profile.name,
      config: {
        tunnel: {
          broker: profile.config.tunnel.broker || 'custom',
          remote_endpoint: profile.config.tunnel.remote_endpoint || '',
          local_ipv6: profile.config.tunnel.local_ipv6 || '',
          remote_ipv6: profile.config.tunnel.remote_ipv6 || '',
          ttl: profile.config.tunnel.ttl || 255,
          mtu: profile.config.tunnel.mtu || 0
        },
        lan: {
          enabled: !!profile.config.lan.enabled,
          dns: profile.config.lan.dns || [],
          mode: profile.config.lan.mode || 'slaac',
          networks: profile.config.lan.networks || []
        },
        health: {
          enabled: !!profile.config.health.enabled,
          interval_sec: profile.config.health.interval_sec || 30,
          target: profile.config.health.target || '',
          auto_restart: !!profile.config.health.auto_restart
        }
      }
    })),
    server: {
      port: configDocument.server.port || 9086,
      wan_interface: configDocument.server.wan_interface || 'ppp0',
      auth_token: configDocument.server.auth_token || ''
    }
  };
}

function createEmptyProfile(name) {
  const uniqueName = makeUniqueProfileName(name);
  const profileId = makeUniqueProfileId(slugifyProfileId(uniqueName));
  return {
    id: profileId,
    name: uniqueName,
    config: {
      tunnel: {
        broker: 'custom',
        remote_endpoint: '',
        local_ipv6: '',
        remote_ipv6: '',
        ttl: 255,
        mtu: 0
      },
      lan: {
        enabled: false,
        dns: [],
        mode: 'slaac',
        networks: []
      },
      health: {
        enabled: true,
        interval_sec: 30,
        target: '2001:4860:4860::8888',
        auto_restart: true
      }
    }
  };
}

function createProfile() {
  syncSelectedProfileFromForm();
  const profile = createEmptyProfile('New Profile');
  configDocument.profiles.push(profile);
  selectedProfileId = profile.id;
  loadSelectedProfileIntoForm();
}

function duplicateProfile() {
  const profile = getSelectedProfile();
  if (!profile) return;
  syncSelectedProfileFromForm();
  const duplicate = deepClone(profile);
  duplicate.name = makeUniqueProfileName((profile.name || 'Profile') + ' Copy');
  duplicate.id = makeUniqueProfileId(slugifyProfileId(duplicate.name));
  delete duplicate.is_valid;
  delete duplicate.validation_errors;
  configDocument.profiles.push(duplicate);
  selectedProfileId = duplicate.id;
  loadSelectedProfileIntoForm();
}

function renameProfile() {
  const profile = getSelectedProfile();
  if (!profile) return;
  const nextName = prompt('Profile name:', profile.name || '');
  if (!nextName) return;
  const trimmedName = nextName.trim();
  if (!trimmedName) return;
  profile.name = trimmedName;
  document.getElementById('cfg-profile-name').value = trimmedName;
  renderProfileSelect();
  renderProfileMeta();
}

function deleteProfile() {
  const profile = getSelectedProfile();
  if (!profile) return;
  if ((configDocument.profiles || []).length <= 1) {
    toast('Cannot delete the last profile', false);
    return;
  }
  if (!confirm('Delete profile "' + profile.name + '"?')) return;
  configDocument.profiles = configDocument.profiles.filter(candidate => candidate.id !== profile.id);
  if (configDocument.active_profile_id === profile.id) {
    configDocument.active_profile_id = configDocument.profiles[0].id;
  }
  selectedProfileId = configDocument.active_profile_id || configDocument.profiles[0].id;
  loadSelectedProfileIntoForm();
}

async function activateProfile() {
  const profile = getSelectedProfile();
  if (!profile) return;
  const previousActiveProfileId = configDocument.active_profile_id;
  configDocument.active_profile_id = profile.id;
  try {
    await saveDocument('Profile activated');
  } catch (e) {
    configDocument.active_profile_id = previousActiveProfileId;
  }
}

function parseConfiguredDNS(value) {
  return value.split(',').map(s => s.trim()).filter(Boolean);
}

function prefixToRouterAddress(prefix) {
  const address = String(prefix || '').split('/')[0].trim();
  if (!address) return '';
  if (address.endsWith('::')) return address + '1';
  if (address.endsWith(':')) return address + '1';
  return address + '::1';
}

function deriveAutoDNSValues(networks) {
  const values = [];
  const seen = new Set();
  networks.forEach(network => {
    const address = prefixToRouterAddress(network.prefix);
    if (!address || seen.has(address)) return;
    seen.add(address);
    values.push(address);
  });
  return values;
}

function collectNetworks() {
  const networks = [];
  document.querySelectorAll('.network-entry').forEach(row => {
    const inputs = row.querySelectorAll('input');
    if (inputs[0].value) {
      networks.push({
        interface: inputs[0].value,
        prefix: inputs[1].value,
        comment: inputs[2].value
      });
    }
  });
  return networks;
}

function refreshAutoDNSField() {
  if (!isUsingAutoDNS || isDNSManuallyEdited) return;
  currentAutoDNSValues = deriveAutoDNSValues(collectNetworks());
  document.getElementById('cfg-dns').value = currentAutoDNSValues.join(', ');
}

async function loadConfig() {
  try {
    configDocument = await api('GET', '/api/config');
    selectedProfileId = configDocument.active_profile_id || ((configDocument.profiles || [])[0] || {}).id || '';
    loadSelectedProfileIntoForm();
  } catch (e) {
    console.error('load config:', e);
  }
}

async function saveDocument(successMessage, shouldReloadConfig = true) {
  const requestDocument = buildRequestDocument();
  try {
    await api('PUT', '/api/config', requestDocument);
    configDocument = requestDocument;
    toast(successMessage, true);
    if (requestDocument.server.auth_token !== authToken) {
      authToken = requestDocument.server.auth_token;
      localStorage.setItem('ipv6tunnel_token', authToken);
    }
    setTimeout(async () => {
      await refreshStatus();
      if (shouldReloadConfig) await loadConfig();
    }, 1200);
  } catch (e) {
    toast('Error: ' + e.message, false);
    if (shouldReloadConfig) await loadConfig();
    throw e;
  }
}

async function saveConfig(e) {
  e.preventDefault();
  await saveDocument('Config saved & reconciled');
}

function parseOptionalNumber(value) {
  const trimmed = String(value || '').trim();
  if (!trimmed) return 0;
  const parsed = parseInt(trimmed, 10);
  return Number.isFinite(parsed) ? parsed : 0;
}

document.getElementById('cfg-dns').addEventListener('input', () => {
  isDNSManuallyEdited = true;
  isUsingAutoDNS = false;
});
document.getElementById('cfg-broker').addEventListener('change', renderBrokerHint);
document.getElementById('cfg-profile-select').addEventListener('change', event => {
  syncSelectedProfileFromForm();
  selectedProfileId = event.target.value;
  loadSelectedProfileIntoForm();
});
document.getElementById('cfg-profile-name').addEventListener('input', () => {
  const profile = getSelectedProfile();
  if (!profile) return;
  profile.name = document.getElementById('cfg-profile-name').value;
  renderProfileSelect();
  renderProfileMeta();
});

refreshStatus().then(() => loadConfig());
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
